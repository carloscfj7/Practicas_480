version: '3.8'

services:
  demo-api:
    build:
      context: .
      dockerfile: .docker/local/Dockerfile
    volumes:
      - '.:/var/www'
    ports:
      - "8001:80"
    depends_on:
      - demo-mysql

  demo-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
      MYSQL_ROOT_PASSWORD: demo
    ports:
      - "3308:3306"
    volumes:
      - db:/var/lib/mysql
    command:
      - mysqld
      - '--default-time-zone=Europe/Madrid'

  demo-mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
      MYSQL_ROOT_PASSWORD: demo
    ports:
      - "3309:3306"
    volumes:
      - db:/var/lib/mysql-test
    command:
      - mysqld
      - '--default-time-zone=Europe/Madrid'

volumes:
  db: