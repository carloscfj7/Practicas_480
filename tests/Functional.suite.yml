# Codeception Test Suite Configuration
#
# Suite for functional tests
# Emulate web requests and make application process them

actor: FunctionalTester
modules:
    enabled:
        - Asserts
        - Symfony:
              app_path: 'src'
              environment: 'test'
              em_clear: true
        - Doctrine:
              depends: Symfony
              cleanup: true
              environment: 'test'
              em_clear: true
        - REST:
            depends: PhpBrowser
            url: 'http://172.18.0.2/api'
            shortDebugResponse: 300
        - PhpBrowser:
            url: 'http://172.18.0.2/api'
