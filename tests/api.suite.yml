actor: ApiTester
suite_namespace: App\Tests\Api
modules:
  enabled:
    - Symfony:
        app_path: 'src'
        environment: 'test'
        kernel_class: 'App\Kernel'
    - Doctrine:
        depends: Symfony
        environment: 'test'
        cleanup: false
        populate: true
    - REST:
        url: 'http://localhost:8001/api'
        depends: Symfony
    - \App\Tests\Support\Helper\FixtureHelper

