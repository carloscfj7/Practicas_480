parameters:
    # Adds a fallback DATABASE_URL if the env var is not set.
    # This allows you to run cache:warmup even if your
    # environment variables are not available yet.
    # You should not need to change this value.
    env(DATABASE_URL): ''

doctrine:
    dbal:
        # configure these for your database server
        driver: 'pdo_mysql'
        server_version: '8.4'
        charset: utf8mb4
        default_table_options:
            charset: utf8mb4
            collate: utf8mb4_unicode_ci
        logging: true

        url: '%env(resolve:DATABASE_URL)%'
        types:
            #User
            Email: App\Shared\Infrastructure\Persistence\Doctrine\DBAL\Types\EmailType
            #ulid
            UserId: App\Shared\Infrastructure\Persistence\Doctrine\DBAL\Types\UserIdType
            ClienteId: App\Clientes\Infrastructure\Persistence\Doctrine\DBAL\Types\ClienteIdType
            ProyectoId: App\Proyectos\Infrastructure\Persistence\Doctrine\DBAL\Types\ProyectoIdType
            ConsultorId: App\Consultores\Infrastructure\Persistence\Doctrine\DBAL\Types\ConsultorIdType
            HabilidadId: App\Consultores\Infrastructure\Persistence\Doctrine\DBAL\Types\HabilidadIdType
            DisponibilidadId: App\Consultores\Infrastructure\Persistence\Doctrine\DBAL\Types\DisponibilidadIdType
            NotificacionId: App\Usuarios\Infrastructure\Persisitence\Doctrine\DBAL\Types\NotificacionIdType
            TareaId: App\Proyectos\Infrastructure\Persistence\Doctrine\DBAL\Types\TareaIdType
            ActividadId: App\Proyectos\Infrastructure\Persistence\Doctrine\DBAL\Types\ActividadIdType




    orm:
        auto_generate_proxy_classes: false
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
            Usuarios:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Usuarios/Domain'
                prefix: 'App\Usuarios\Domain'
                alias: Usuarios
            Consultores:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Consultores/Domain'
                prefix: 'App\Consultores\Domain'
                alias: Consultores
            Proyectos:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Proyectos/Domain'
                prefix: 'App\Proyectos\Domain'
                alias: Proyectos
            Clientes:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Clientes/Domain'
                prefix: 'App\Clientes\Domain'
                alias: Clientes


        filters:
            softdeleteable:
                class: Gedmo\SoftDeleteable\Filter\SoftDeleteableFilter
                enabled: true

when@test:
    doctrine:
        dbal:
            # configure these for your database server
            driver: 'pdo_mysql'
            server_version: '8.4'
            charset: utf8mb4
            default_table_options:
                charset: utf8mb4
                collate: utf8mb4_unicode_ci

            dbname: 'demo-test'
            host: 'demo-mysql-test'
            port: '3306'
            user: 'demo'
            password: 'demo'

            url: '%env(resolve:DATABASE_URL_TEST)%'

        orm:
            auto_mapping: true